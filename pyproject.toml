[build-system]
requires = ["poetry-core>=2.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
name = "ema-data-access"
version = "0.4.0"
description = "EMA Data Access"
authors = ["EMA PDC Developers"]
readme = "README.md"
license = "MIT"

[tool.poetry.dependencies]
python = ">=3.12,<4"
requests = ">=2.28.0,<3.0.0"
pre-commit = {version = "^4.0.0", optional = true}
pytest = {version = ">=6.2.5", optional = true}
pytest-cov = {version = "^4.0.0", optional = true}
ruff = {version = ">=0.2.1", optional = true}

[tool.poetry.scripts]
ema-data-access = "ema_data_access.cli:main"

[tool.poetry.extras]
dev = ["pre-commit", "ruff"]
test = ["pytest", "pytest-cov"]

[tool.pytest.ini_options]
testpaths = [
  "tests",
]
addopts = "-ra"

[tool.ruff]
target-version = "py312"
lint.select = ["B", "E", "D", "F", "I", "N", "S", "W", "PL", "PT", "UP", "RUF"]
# D104: Missing docstring in public package
# D203: 1 blank line required before class docstring
# D213: Multi-line docstring summary should start at the second line
# D413: Missing blank line after last section
# PLR2004: Magic value in comparison
lint.ignore = ["D104", "D203", "D213", "D413", "PLR2004"]

[tool.ruff.lint.per-file-ignores]
# S101: Use of assert detected
# S105: Possible hardcoded password (false positives from asserting on token values)
"tests/*" = ["S101", "S105"]